# Shared security response headers for the docs site.
#
# nginx REPLACES (does not merge) inherited `add_header` directives in any
# `location` that sets its own `add_header`. The static-asset location sets
# Cache-Control, which would otherwise silently DROP these server-level security
# headers for JS/CSS/font/image responses. So they live here and are `include`d
# both in the server block and in the asset location. (The document-scoped CSP
# stays in nginx.conf.)
add_header X-Content-Type-Options    "nosniff"                          always;
add_header X-Frame-Options           "DENY"                             always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                     always;
add_header Cross-Origin-Resource-Policy "same-origin"                   always;
