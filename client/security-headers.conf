# Shared security response headers.
#
# nginx REPLACES (does not merge) inherited `add_header` directives in any
# `location` that sets its own `add_header`. Several asset / sw.js / manifest
# locations set Cache-Control, which would otherwise silently DROP every
# server-level security header for those responses. So these headers live here
# and are `include`d both in the server block and in each such location.
#
# The document-scoped Content-Security-Policy stays in nginx.conf (it is inert on
# non-document responses). HSTS is intentionally omitted (terminated at the
# edge / Traefik; see SECURITY-REVIEW.md).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
