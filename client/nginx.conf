worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    server_tokens off;

    # Logs to stdout/stderr so the container engine ingests them.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /dev/stdout main;

    # Temp paths under /tmp so the rootfs can stay read-only.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Has to fit the largest payload axum accepts (the scan ingest route
    # caps at 256 MB — a 48-frame turntable submission plus, for gsplat scans,
    # the original capture video). Lower per-location overrides below tighten
    # it for narrower routes — but the global has to be ≥ the largest one to
    # avoid mid-stream truncation that surfaces as an opaque
    # "could not read frame" / 400 on the client.
    client_max_body_size 256m;

    # Map the WebSocket upgrade header into a Connection value.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm application/manifest+json
               image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # Backend upstream (Rust/Axum container on the same docker network).
    # ------------------------------------------------------------------
    upstream backend {
        server server:3000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # --- Default security headers (applied to all responses) ---
        # Shared so locations that set their own add_header (which makes nginx drop
        # inherited ones) can re-include them via one directive. CSP stays below
        # (document-scoped, inert on asset responses).
        include /etc/nginx/security-headers.conf;

        # --- Content-Security-Policy ---
        # With the reverse proxy, /api/* is same-origin, so 'self' covers it.
        # Google Fonts is whitelisted explicitly because Direction B loads
        # Cormorant Garamond / Inter / Noto Serif JP from fonts.gstatic.com.
        # Extend img-src / connect-src as Phase 2+ adds MFC / AniList CDNs.
        # CSP notes:
        # - `blob:` in img-src / media-src / connect-src for turntable + photo
        #   editor previews (URL.createObjectURL).
        # - `https://staticimgly.com` in connect-src for the @imgly background-
        #   removal model + WASM artefacts fetched at first run (~80 MB ONNX).
        # - `blob:` + `'wasm-unsafe-eval'` + `'unsafe-eval'` in script-src:
        #     * ONNX Runtime spawns its inference worker from a generated
        #       blob URL (blob:).
        #     * ONNX Runtime's WASM bootstrap uses WebAssembly.compile, which
        #       needs wasm-unsafe-eval.
        #     * ONNX Runtime's hot-path code uses `new Function(...)` for
        #       JIT-style kernel selection; that triggers the eval check and
        #       needs unsafe-eval. There's no way to disable this in ORT.
        add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' blob: 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: wss: https://staticimgly.com; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ------------------------------------------------------------------
        # Real client IP for the backend rate limiter.
        #
        # The Axum backend rate-limits /api/auth/* and /api/g/* keyed on the
        # client IP it reads from X-Forwarded-For (leftmost entry). To stop a
        # client from spoofing that key (and bypassing brute-force protection),
        # the /api/ blocks below set X-Forwarded-For to `$remote_addr` —
        # OVERWRITING, not appending, any client-supplied value.
        #
        # Single-hop deployments (dev, or nginx as the edge): `$remote_addr` is
        # the real client → correct and unspoofable as-is.
        #
        # Behind a trusted edge proxy (prod = Traefik → this nginx): `$remote_addr`
        # is Traefik, so every user would share one rate-limit bucket. To recover
        # the real client without re-opening the spoof, UNCOMMENT the block below
        # and set the trusted proxy's network to the SMALLEST range that fits
        # your Traefik (NOT a broad RFC-1918 — that would let any private peer
        # spoof XFF again):
        #
        #   set_real_ip_from 10.42.0.0/16;   # <- your traefik_edge subnet
        #   real_ip_header   X-Forwarded-For;
        #   real_ip_recursive on;
        #
        # With it enabled, $remote_addr resolves to the real client and the
        # X-Forwarded-For overwrite below carries that trusted value.

        # ------------------------------------------------------------------
        # WebSocket — explicit match before the generic /api/ block.
        # ------------------------------------------------------------------
        location = /api/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append) XFF with the trusted immediate peer — anti-spoof
        # for the backend rate limiter; see the real_ip note above.
        proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # Internal-only API — e.g. the embed worker's owned-photo fetch route.
        # The worker reaches the backend DIRECTLY on the Docker network
        # (SERVER_URL=http://server:3000), never through this public proxy, so
        # hiding /api/internal/ here blocks ONLY external callers. Defence in
        # depth on top of the backend's bearer-token gate (these routes can
        # return private photo bytes). 404 (not 403) so the route's existence
        # isn't even revealed. nginx matches the longest prefix, so this wins
        # over /api/ for these paths regardless of block order.
        # ------------------------------------------------------------------
        location /api/internal/ {
            return 404;
        }

        # ------------------------------------------------------------------
        # API reverse proxy — everything under /api/* hits the Axum backend.
        # Per-route size limits are enforced server-side via tower-http's
        # RequestBodyLimitLayer (8 MB for photos, 96 MB for scans). nginx
        # only enforces the loose global cap above.
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append) XFF with the trusted immediate peer — anti-spoof
        # for the backend rate limiter; see the real_ip note above.
        proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            # Scan ingest can ship ~50 MB of multipart frames — bump the read
            # timeout above the default 60s so slow uploads don't get cut.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- ESM modules (.mjs): force a JavaScript MIME type ---
        # nginx's bundled mime.types (Chainguard build) maps `.js` but NOT
        # `.mjs`, so those files fall through to default_type
        # (application/octet-stream). With X-Content-Type-Options: nosniff the
        # browser then refuses to evaluate them as ES modules, breaking the
        # ONNX Runtime 1.26 dynamic import (`/ort/*.mjs`, loaded by
        # transformers.js for the visual-search embedder). Serve `.mjs` as
        # JavaScript and cache it like the other hashed assets. Must precede
        # the generic asset location so it wins the regex match.
        location ~* \.mjs$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            default_type text/javascript;
            try_files $uri =404;
        }

        # --- Hashed assets: cache forever ---
        # `.onnx` are the in-browser ML models (e5 ~118 MB, SigLIP text ~283 MB).
        # They live at content-stable, repo-versioned paths, so cache them
        # immutably too: lets the browser AND any CDN/edge (Cloudflare) keep them
        # instead of re-fetching the big files from the origin every load — which
        # is what makes a 283 MB transfer through the edge flaky.
        location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|webp|jpg|jpeg|gif|wasm|onnx)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # --- Service worker + manifest: must revalidate each load ---
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            types { } default_type "application/manifest+json";
            try_files $uri =404;
        }

        # --- SPA fallback ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- Block dotfiles (except .well-known) ---
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
