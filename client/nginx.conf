worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    server_tokens off;

    # Logs to stdout/stderr so the container engine ingests them.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /dev/stdout main;

    # Temp paths under /tmp so the rootfs can stay read-only.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Has to fit the largest payload axum accepts (the scan ingest route
    # caps at 96 MB for a 48-frame turntable submission). Lower per-location
    # overrides below tighten it for narrower routes — but the global has
    # to be ≥ the largest one to avoid mid-stream truncation that surfaces
    # as an opaque "could not read frame" / 400 on the client.
    client_max_body_size 96m;

    # Map the WebSocket upgrade header into a Connection value.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm application/manifest+json
               image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # Backend upstream (Rust/Axum container on the same docker network).
    # ------------------------------------------------------------------
    upstream backend {
        server server:3000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # --- Default security headers (applied to all responses) ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;

        # --- Content-Security-Policy ---
        # With the reverse proxy, /api/* is same-origin, so 'self' covers it.
        # Google Fonts is whitelisted explicitly because Direction B loads
        # Cormorant Garamond / Inter / Noto Serif JP from fonts.gstatic.com.
        # Extend img-src / connect-src as Phase 2+ adds MFC / AniList CDNs.
        # CSP notes:
        # - `blob:` in img-src / media-src / connect-src for turntable + photo
        #   editor previews (URL.createObjectURL).
        # - `https://staticimgly.com` in connect-src for the @imgly background-
        #   removal model + WASM artefacts fetched at first run (~80 MB ONNX).
        # - `blob:` + `'wasm-unsafe-eval'` + `'unsafe-eval'` in script-src:
        #     * ONNX Runtime spawns its inference worker from a generated
        #       blob URL (blob:).
        #     * ONNX Runtime's WASM bootstrap uses WebAssembly.compile, which
        #       needs wasm-unsafe-eval.
        #     * ONNX Runtime's hot-path code uses `new Function(...)` for
        #       JIT-style kernel selection; that triggers the eval check and
        #       needs unsafe-eval. There's no way to disable this in ORT.
        add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' blob: 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: wss: https://staticimgly.com; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ------------------------------------------------------------------
        # WebSocket — explicit match before the generic /api/ block.
        # ------------------------------------------------------------------
        location = /api/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # API reverse proxy — everything under /api/* hits the Axum backend.
        # Per-route size limits are enforced server-side via tower-http's
        # RequestBodyLimitLayer (8 MB for photos, 96 MB for scans). nginx
        # only enforces the loose global cap above.
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            # Scan ingest can ship ~50 MB of multipart frames — bump the read
            # timeout above the default 60s so slow uploads don't get cut.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- Hashed assets: cache forever ---
        location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|webp|jpg|jpeg|gif|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # --- Service worker + manifest: must revalidate each load ---
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache" always;
            types { } default_type "application/manifest+json";
            try_files $uri =404;
        }

        # --- SPA fallback ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- Block dotfiles (except .well-known) ---
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
