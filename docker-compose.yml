# ============================================================================
# FigureCollector — local development stack
#
# Layout:
#   - postgres / garage run in containers (with light hardening)
#   - server + client are built from local source with full hardening
#     (read-only rootfs, cap_drop ALL, no-new-privileges, tmpfs noexec/nosuid)
#
# For fast iteration you can also run `cargo run` and `pnpm dev` directly on
# the host and only use `docker compose up postgres garage` from here.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: figurecollector
      POSTGRES_USER: figurecollector
      POSTGRES_PASSWORD: figurecollector_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "8432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figurecollector"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - ip6net

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    volumes:
      - ./infrastructure/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"   # admin API (for `garage` CLI)
      - "3902:3902"   # S3 API
    environment:
      # Generate with: openssl rand -hex 32
      # Dev-only default; override in your shell or .env for staging.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-d83d9c0fde54bce93deeee2eef2bbf2f6c01e0d8e7b3b7c2cc7e3fc9b58a64ef}
    # `garage status` shells out the binary itself (no sh in scratch image).
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - ip6net

  # ------------------------------------------------------------------
  # One-shot bootstrap: assigns a layout, creates the bucket, imports
  # deterministic dev S3 credentials and grants the bucket to that key.
  # Idempotent — safe to re-run; everything ignores 409s.
  # ------------------------------------------------------------------
  garage-init:
    image: alpine:3.23
    depends_on:
      garage:
        condition: service_started
    restart: "no"
    environment:
      GARAGE_ADMIN: http://garage:3900/v1
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev-admin-token-change-me}
      S3_BUCKET: ${S3_BUCKET:-figurecollector}
      # Dev creds — pinned so server + gsplat-worker share them out of the box.
      # Garage format: access key = "GK" + 24 hex chars (12 bytes), secret = 64
      # hex chars (32 bytes). The values below are dev-only; override in .env
      # if you want different keys.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache curl jq >/dev/null

        AUTH="Authorization: Bearer $$GARAGE_ADMIN_TOKEN"

        echo "[init] waiting for garage admin API…"
        until curl -sf -H "$$AUTH" "$$GARAGE_ADMIN/status" >/dev/null; do sleep 1; done

        # 1. Layout — assign the single node once, then apply.
        LAYOUT=$$(curl -sf -H "$$AUTH" "$$GARAGE_ADMIN/layout")
        APPLIED=$$(echo "$$LAYOUT" | jq -r '.version // 0')
        if [ "$$APPLIED" = "0" ]; then
          NODE_ID=$$(curl -sf -H "$$AUTH" "$$GARAGE_ADMIN/status" | jq -r '.node')
          echo "[init] assigning layout for node $$NODE_ID"
          curl -sf -X POST -H "$$AUTH" -H 'Content-Type: application/json' \
            -d "[{\"id\":\"$$NODE_ID\",\"zone\":\"dev\",\"capacity\":1000000000,\"tags\":[]}]" \
            "$$GARAGE_ADMIN/layout" >/dev/null
          curl -sf -X POST -H "$$AUTH" -H 'Content-Type: application/json' \
            -d '{"version":1}' "$$GARAGE_ADMIN/layout/apply" >/dev/null
          echo "[init] layout applied"
        else
          echo "[init] layout already at v$$APPLIED — skipping"
        fi

        # 2. Bucket — create if absent.
        if ! curl -sf -H "$$AUTH" "$$GARAGE_ADMIN/bucket?globalAlias=$$S3_BUCKET" >/dev/null 2>&1; then
          echo "[init] creating bucket $$S3_BUCKET"
          curl -sf -X POST -H "$$AUTH" -H 'Content-Type: application/json' \
            -d "{\"globalAlias\":\"$$S3_BUCKET\"}" \
            "$$GARAGE_ADMIN/bucket" >/dev/null
        else
          echo "[init] bucket $$S3_BUCKET already exists"
        fi
        BUCKET_ID=$$(curl -sf -H "$$AUTH" "$$GARAGE_ADMIN/bucket?globalAlias=$$S3_BUCKET" | jq -r '.id')

        # 3. Key — import the deterministic dev credentials.
        if ! curl -sf -H "$$AUTH" "$$GARAGE_ADMIN/key?id=$$S3_ACCESS_KEY" >/dev/null 2>&1; then
          echo "[init] importing dev key $$S3_ACCESS_KEY"
          curl -sf -X POST -H "$$AUTH" -H 'Content-Type: application/json' \
            -d "{\"name\":\"figurecollector-dev\",\"accessKeyId\":\"$$S3_ACCESS_KEY\",\"secretAccessKey\":\"$$S3_SECRET_KEY\"}" \
            "$$GARAGE_ADMIN/key/import" >/dev/null
        else
          echo "[init] key $$S3_ACCESS_KEY already present"
        fi

        # 4. Grant — bucket ↔ key (read/write/owner).
        echo "[init] granting bucket to key"
        curl -sf -X POST -H "$$AUTH" -H 'Content-Type: application/json' \
          -d "{\"bucketId\":\"$$BUCKET_ID\",\"accessKeyId\":\"$$S3_ACCESS_KEY\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}" \
          "$$GARAGE_ADMIN/bucket/allow" >/dev/null

        echo "[init] garage bootstrap complete."
    security_opt:
      - no-new-privileges:true
    networks:
      - ip6net

  server:
    # No host port mapping — the API is only reachable through the `client`
    # nginx reverse proxy at http://localhost:5173/api/*. For direct debugging
    # use `docker compose exec server …` or run `cargo run` on the host.
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      FC_BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: info,figurecollector_server=debug
      DATABASE_URL: postgres://figurecollector:figurecollector_dev@postgres:5432/figurecollector
      FRONTEND_URL: http://localhost:5173

      # S3 / Garage — the values below mirror garage-init's deterministic
      # dev credentials. Override in your shell / .env for staging.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3902}
      S3_BUCKET: ${S3_BUCKET:-figurecollector}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

      # OIDC providers — leave unset to disable; local username/password
      # auth still works without them.
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      OIDC_GENERIC_CLIENT_ID: ${OIDC_GENERIC_CLIENT_ID:-}
      OIDC_GENERIC_CLIENT_SECRET: ${OIDC_GENERIC_CLIENT_SECRET:-}
      OIDC_GENERIC_ISSUER_URL: ${OIDC_GENERIC_ISSUER_URL:-}

      # Shipping tracking API keys — optional. When unset the corresponding
      # /api/tracking/{carrier}/… route returns FeatureDisabled and the SPA
      # falls back to a plain "open carrier page" link.
      #   - Colissimo: free okapi key at https://developer.laposte.fr
      #   - DHL Express: register at https://developer.dhl.com
      #   - UPS: OAuth2 credentials at https://developer.ups.com
      COLISSIMO_API_KEY: ${COLISSIMO_API_KEY:-}
      DHL_API_KEY: ${DHL_API_KEY:-}
      UPS_CLIENT_ID: ${UPS_CLIENT_ID:-}
      UPS_CLIENT_SECRET: ${UPS_CLIENT_SECRET:-}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65532:65532"
    networks:
      - ip6net

  # ------------------------------------------------------------------
  # `client` is the unified web ingress: nginx serves the React PWA
  # AND reverse-proxies /api/* and /api/ws to the Rust backend.
  # It is the ONLY service exposing a host port for the app itself.
  # ------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777,noexec,nosuid,nodev
      - /tmp/nginx:size=8M,mode=1777,noexec,nosuid,nodev
      - /var/cache/nginx:size=16M,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ip6net

volumes:
  postgres_data:
  garage_meta:
  garage_data:

networks:
  ip6net:
    driver: bridge
    enable_ipv6: true
