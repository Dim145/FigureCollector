# =============================================================================
# Build + deploy the FigureCollector documentation to GitHub Pages.
#
# Triggers:
#   - push to `main` that touches anything under docs/
#   - manual run via the Actions tab
#
# Uses the canonical GitHub Pages deploy chain (configure-pages →
# upload-pages-artifact → deploy-pages) — no third-party actions needed.
# =============================================================================

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Required permissions for the official deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run multiple deploys in parallel — race against the GitHub Pages
# environment would just queue them anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        working-directory: docs
        # No `--no-cache-dir` here: it's contradictory with the
        # `cache: pip` enabled on setup-python above and causes the
        # post-job cache-save step to fail when there's nothing to
        # save. Let pip populate ~/.cache/pip so setup-python can
        # restore it on subsequent runs.
        run: pip install -r requirements.txt

      - name: Build site (strict — fail on broken links)
        working-directory: docs
        run: mkdocs build --strict --site-dir _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
