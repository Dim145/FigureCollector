# =============================================================================
# Build + deploy the FigureCollector documentation to GitHub Pages.
#
# Triggers:
#   - push to `main` that touches anything under docs/
#   - manual run via the Actions tab
#
# Uses the canonical GitHub Pages deploy chain (configure-pages →
# upload-pages-artifact → deploy-pages) — no third-party actions needed.
# =============================================================================

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Required permissions for the official deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run multiple deploys in parallel — race against the GitHub Pages
# environment would just queue them anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        working-directory: docs
        # No `--no-cache-dir` here: it's contradictory with the
        # `cache: pip` enabled on setup-python above and causes the
        # post-job cache-save step to fail when there's nothing to
        # save. Let pip populate ~/.cache/pip so setup-python can
        # restore it on subsequent runs.
        run: pip install -r requirements.txt

      - name: Build site (strict — fail on broken links)
        working-directory: docs
        run: mkdocs build --strict --site-dir _site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
