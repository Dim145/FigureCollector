# ============================================================================
# FigureCollector — production stack (behind Traefik)
#
# This compose file expects:
#   - A `traefik_edge` external network created by your reverse proxy stack
#   - All secrets supplied via the environment (no defaults; missing ones fail)
#   - DNS records pointing at the Traefik node for ${WEB_DOMAIN} and ${API_DOMAIN}
# ============================================================================

services:
  postgres:
    # pgvector/pgvector ships PostgreSQL 16 + the `vector` extension (visual
    # search embeddings). Same PG16 major as before, so the data volume is
    # compatible; it just adds the extension `postgres:16-alpine` lacked.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-figurecollector}
      POSTGRES_USER: ${POSTGRES_USER:-figurecollector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-figurecollector}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # ------------------------------------------------------------------
  # `server` is internal-only in prod. The `client` nginx in front of it
  # reverse-proxies /api/* + /api/ws; Traefik only knows about the client.
  # ------------------------------------------------------------------
  server:
    image: ghcr.io/dim145/figurecollector-server:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FC_BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-figurecollector}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-figurecollector}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required (e.g. https://figures.example.com)}
      # OIDC_REDIRECT_BASE defaults to FRONTEND_URL — only set this if the
      # OAuth callback comes back on a different host than the SPA.
      OIDC_REDIRECT_BASE: ${OIDC_REDIRECT_BASE:-}
      ALLOW_LOCAL_SIGNUP: ${ALLOW_LOCAL_SIGNUP:-false}

      # OIDC — at least one provider should be configured; otherwise only
      # local username/password works (and only if ALLOW_LOCAL_SIGNUP=true).
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      OIDC_GOOGLE_DISPLAY_NAME: ${OIDC_GOOGLE_DISPLAY_NAME:-Google}
      OIDC_GOOGLE_ISSUER_URL: ${OIDC_GOOGLE_ISSUER_URL:-https://accounts.google.com}
      OIDC_GENERIC_CLIENT_ID: ${OIDC_GENERIC_CLIENT_ID:-}
      OIDC_GENERIC_CLIENT_SECRET: ${OIDC_GENERIC_CLIENT_SECRET:-}
      OIDC_GENERIC_ISSUER_URL: ${OIDC_GENERIC_ISSUER_URL:-}
      OIDC_GENERIC_DISPLAY_NAME: ${OIDC_GENERIC_DISPLAY_NAME:-SSO}

      # Auth rate limit — values below match the lib defaults.
      AUTH_RATE_LIMIT_PER_SECOND: ${AUTH_RATE_LIMIT_PER_SECOND:-2}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-5}

      # S3 / Garage — required for photo + scan uploads.
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required (e.g. https://garage.example.com)}
      S3_BUCKET: ${S3_BUCKET:-figurecollector}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65532:65532"
    expose:
      - "3000"
    networks:
      - internal

  # ------------------------------------------------------------------
  # `client` is the unified web ingress (nginx serves static + proxies
  # /api/* + /api/ws). Traefik terminates TLS in front of it.
  # ------------------------------------------------------------------
  client:
    image: ghcr.io/dim145/figurecollector-client:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777,noexec,nosuid,nodev
      - /tmp/nginx:size=8M,mode=1777,noexec,nosuid,nodev
      - /var/cache/nginx:size=16M,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_edge"
      - "traefik.http.routers.fc-web.rule=Host(`${WEB_DOMAIN:?WEB_DOMAIN is required}`)"
      - "traefik.http.routers.fc-web.entrypoints=websecure"
      - "traefik.http.routers.fc-web.tls=true"
      - "traefik.http.routers.fc-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.fc-web.loadbalancer.server.port=8080"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    external: true
    name: traefik_edge
