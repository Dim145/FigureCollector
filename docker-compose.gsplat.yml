# =============================================================================
# FigureCollector — Phase 5B overlay: Gaussian Splatting worker
#
# Opt-in sidecar that trains a 3D Gaussian Splatting model from a scan's
# frames. Heavy: ~10-15 GB image, needs an NVIDIA GPU with ≥8 GB VRAM and
# the NVIDIA Container Toolkit installed on the host.
#
# Run alongside the dev stack:
#   docker compose -f docker-compose.yml -f docker-compose.gsplat.yml up -d
#
# Run alongside prod:
#   docker compose -f docker-compose.prod.yml -f docker-compose.gsplat.yml up -d
#
# Required env (set in your shell or .env):
#   S3_ACCESS_KEY, S3_SECRET_KEY  — Garage credentials the backend already uses
# =============================================================================

services:
  gsplat-worker:
    build:
      context: ./infrastructure/gsplat-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://figurecollector:figurecollector_dev@postgres:5432/figurecollector}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3902}
      S3_BUCKET: ${S3_BUCKET:-figurecollector}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:-garage}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      TRAINING_ITERATIONS: ${TRAINING_ITERATIONS:-30000}
      # COLMAP feature extraction + matching on the GPU (CUDA). Set
      # COLMAP_USE_GPU=false to force CPU. The COLMAP 4.x mapper stays on CPU.
      COLMAP_USE_GPU: ${COLMAP_USE_GPU:-true}
      # `all` (or at least compute,utility,graphics): `graphics` is REQUIRED for
      # Brush, which trains via Vulkan (wgpu) — `compute,utility` alone leaves the
      # NVIDIA Vulkan ICD un-injected and Brush sees no GPU.
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
      # Frame budget. With CUDA SIFT the feature step is cheap; the cost left on
      # CPU is the mapper. 100 frames is a good default; raise to 150 (and
      # VIDEO_MAX_DIM to 2048) for more detail if your host has the RAM.
      VIDEO_TARGET_FRAMES: ${VIDEO_TARGET_FRAMES:-100}
      VIDEO_MAX_DIM: ${VIDEO_MAX_DIM:-1600}
      # rembg-mask the figure (on by default — it's an object scanner). The
      # cutout's alpha is baked into the frames (Brush skips the background) and
      # a binary mask feeds COLMAP's mask_path (SfM tracks the figure).
      ENABLE_MASKING: ${ENABLE_MASKING:-true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    networks:
      - ip6net

networks:
  ip6net:
    external: true
    name: figurecollector_ip6net
