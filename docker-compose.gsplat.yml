# =============================================================================
# FigureCollector — Phase 5B overlay: Gaussian Splatting worker
#
# Opt-in sidecar that trains a 3D Gaussian Splatting model from a scan's
# frames. Heavy: ~8 GB image (slim CUDA 12 base), needs an NVIDIA GPU with
# ≥6 GB VRAM and the NVIDIA Container Toolkit installed on the host.
#
# Run alongside the dev stack:
#   docker compose -f docker-compose.yml -f docker-compose.gsplat.yml up -d
#
# Run alongside prod:
#   docker compose -f docker-compose.prod.yml -f docker-compose.gsplat.yml up -d
#
# Required env (set in your shell or .env):
#   S3_ACCESS_KEY, S3_SECRET_KEY  — Garage credentials the backend already uses
# =============================================================================

services:
  gsplat-worker:
    build:
      context: ./infrastructure/gsplat-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://figurecollector:figurecollector_dev@postgres:5432/figurecollector}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3902}
      S3_BUCKET: ${S3_BUCKET:-figurecollector}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:-garage}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      # gsplat MCMC training iterations. 30k is the splatting standard; 15k is a
      # faster, slightly softer fit.
      TRAINING_ITERATIONS: ${TRAINING_ITERATIONS:-30000}
      # MCMC Gaussian cap — the dominant VRAM lever (MCMC grows to the cap and
      # holds it). 250k fits a single figure on a 6 GB card; lower on OOM, raise
      # for more detail if VRAM allows.
      GSPLAT_CAP_MAX: ${GSPLAT_CAP_MAX:-250000}
      # Longest image side trained on — the other VRAM lever. Raise for sharper
      # results if VRAM allows; lower on OOM.
      GSPLAT_MAX_RES: ${GSPLAT_MAX_RES:-1600}
      # Floater/haze pruning at export. Drop gaussians fainter than MIN_OPACITY,
      # and (CROP_MARGIN>0) those farther than CROP_MARGIN x the p98 radius from
      # the figure's centre. If artifacts remain, lower CROP_MARGIN (e.g. 1.2) or
      # raise MIN_OPACITY (e.g. 0.15); if the figure gets clipped, raise CROP_MARGIN
      # or set it to 0 to disable the spatial crop.
      GSPLAT_MIN_OPACITY: ${GSPLAT_MIN_OPACITY:-0.08}
      GSPLAT_CROP_MARGIN: ${GSPLAT_CROP_MARGIN:-1.5}
      # Quality knobs — all default-on; flip off WITHOUT a rebuild if a scan
      # destabilises or OOMs. Undistort to pinhole before training; antialiased
      # rasterisation; joint camera-pose refinement (corrects COLMAP error → less
      # blur); anti-"spike" gaussian regulariser. See the worker README.
      GSPLAT_UNDISTORT: ${GSPLAT_UNDISTORT:-true}
      GSPLAT_ANTIALIAS: ${GSPLAT_ANTIALIAS:-true}
      GSPLAT_POSE_OPT: ${GSPLAT_POSE_OPT:-true}
      GSPLAT_ANISO_REG: ${GSPLAT_ANISO_REG:-0.01}
      # SIFT features per image. 8192 ~halves matching + the mapper's bundle
      # adjustment vs 16384, with no quality loss on glossy turntables; bump to
      # 16384 if registration drops on a hard capture.
      COLMAP_MAX_FEATURES: ${COLMAP_MAX_FEATURES:-8192}
      # GPU COLMAP SIFT extraction + matching (CUDA build of 4.0.4). false forces
      # CPU for both — deterministic, slower. NB: GPU SIFT extraction is
      # non-deterministic; if a glossy turntable flaps between a full model and a
      # 2-frame stub, set this false (the macOS worker extracts on CPU on purpose).
      # The incremental mapper is always CPU.
      COLMAP_USE_GPU: ${COLMAP_USE_GPU:-true}
      # GPU bundle adjustment in the mapper (--Mapper.ba_use_gpu). Off by default:
      # it only pays off on large reconstructions (~1500+ images), so at ~150
      # frames it's usually no faster (often slower); falls back to CPU if Ceres
      # has no CUDA. Flip on to experiment.
      COLMAP_BA_USE_GPU: ${COLMAP_BA_USE_GPU:-false}
      # `all` exposes the `graphics` capability COLMAP's CUDA SIFT (SiftGPU) may
      # need on top of compute/utility (rembg + gsplat training only need
      # compute). No Vulkan is used any more; `all` is just the safe superset for
      # GPU COLMAP.
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
      # Frame budget. 100 is a good default; raise to 150 (and VIDEO_MAX_DIM to
      # 2048) for more detail if your host has the RAM. The CPU mapper is the cost.
      VIDEO_TARGET_FRAMES: ${VIDEO_TARGET_FRAMES:-100}
      VIDEO_MAX_DIM: ${VIDEO_MAX_DIM:-1600}
      # Decode the source video on the GPU (NVDEC) during frame extraction; only
      # the decode is offloaded (PNG encode stays CPU), and it falls back to CPU on
      # any failure. Needs the `video` driver cap (covered by `all` above).
      FFMPEG_USE_GPU: ${FFMPEG_USE_GPU:-true}
      # rembg-mask the figure (on by default — it's an object scanner). One pass
      # feeds COLMAP's mask_path (SfM tracks the figure) and the trainer's loss
      # (background pixels contribute zero loss → no haze).
      ENABLE_MASKING: ${ENABLE_MASKING:-true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    networks:
      - ip6net

networks:
  ip6net:
    external: true
    name: figurecollector_ip6net
