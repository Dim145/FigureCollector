# =============================================================================
# FigureCollector docs — hardened nginx config
#
# Mirrors the posture of client/nginx.conf but stripped to the docs essentials:
# no API proxy, no WebSocket, no PWA service worker handling. Just a static
# site served on :8080 with strict security headers.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Compose-mounted tmpfs targets — see docker-compose.docs.yml.
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Log to stdout/stderr so the Docker daemon captures it.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ─── Security headers ────────────────────────────────────────────────
        # The docs site has NO external connections, NO inline scripts, NO
        # iframes. The CSP can be very tight.
        add_header X-Content-Type-Options    "nosniff"                always;
        add_header X-Frame-Options           "DENY"                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin"           always;
        add_header Cross-Origin-Resource-Policy "same-origin"         always;
        # MkDocs Material loads its theme JS/CSS from the same origin only.
        # SVG icons via twemoji come from the same origin (mkdocs-material
        # ships them as bundled SVGs, not external CDN).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # ─── Static asset caching ────────────────────────────────────────────
        # Hashed asset files (MkDocs Material adds hashes to its bundled JS/CSS)
        # are immutable; everything else gets a short cache so doc edits surface
        # within an hour.
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # ─── SPA-style fallback for "pretty URLs" without trailing slashes ───
        # MkDocs generates /foo/index.html. Make /foo and /foo/ both resolve.
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        # Hide dotfiles + backup files.
        location ~ /\. {
            deny all;
        }
        location ~ ~$ {
            deny all;
        }
    }
}
