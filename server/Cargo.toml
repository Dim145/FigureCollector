[package]
name = "figurecollector-server"
version = "0.48.7"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "FigureCollector backend — hardened Rust/Axum API for self-hosted figurine collection management"
repository = "https://github.com/Dim145/FigureCollector"
publish = false

[[bin]]
name = "figurecollector-server"
path = "src/main.rs"

[dependencies]
# --- Web stack ---
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit", "request-id"] }
tower_governor = "0.8"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Serialization & errors ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

# --- CLI ---
clap = { version = "4", features = ["derive", "env"] }

# --- Misc utilities ---
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
time = { version = "0.3", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
bytes = "1"
futures = "0.3"
# Cron-expression parser for the admin-scheduled price-refresh job
# (services::price_cron). Pure Rust, chrono-native — no OpenSSL. An empty
# schedule disables the feature.
croner = "4"

# --- In-process cache (moka, pure-Rust, no OpenSSL) ---
# Backs the `cache` module's default in-memory backend (per-entry TTL via moka's
# Expiry trait). Pluggable: a Redis/memcached backend is just another CacheStore
# impl behind the same trait, selected by CACHE_BACKEND.
moka = { version = "0.12", features = ["future"] }

# --- Database (sqlx with rustls / aws-lc-rs — NO OpenSSL) ---
sqlx = { version = "0.9", default-features = false, features = [
    "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs",
    "chrono", "uuid", "json", "macros", "migrate", "rust_decimal",
] }

# --- pgvector — vector(384) embeddings for the visual (photo) search ---
# Already pinned to 0.4.2 in Cargo.lock (pulled transitively by sea-orm). Its
# only extra dep is serde + the sqlx Encode/Decode glue — no OpenSSL, so it
# respects the zero-OpenSSL hard rule.
pgvector = { version = "0.4", default-features = false, features = ["sqlx"] }

# --- Sessions (Postgres-backed) ---
# tower-sessions-sqlx-store 0.16 is the release built on sqlx 0.9 and
# tower-sessions 0.15 — the three move together.
tower-sessions = "0.15"
tower-sessions-sqlx-store = { version = "0.16", default-features = false, features = ["postgres"] }

# --- Sea-ORM migrations + entities ---
# `runtime-tokio`, not `runtime-tokio-rustls`: in sea-orm 2 the latter turns on
# sqlx's ring-based rustls. TLS comes from our own sqlx dependency above
# (`tls-rustls-aws-lc-rs`), which feature-unifies into the same sqlx.
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "runtime-tokio",
    "sqlx-postgres",
] }

# --- Password hashing (local auth) ---
# 0.6: the salt comes from `getrandom` (default feature), no RNG plumbing.
argon2 = "0.6"
password-hash = { version = "0.6", features = ["alloc", "getrandom"] }
rand = "0.10"

# --- OIDC ---
# No `reqwest` feature: openidconnect 4 only has an adapter for reqwest 0.12.
# `http_tls::OidcHttpClient` is the same adapter for our reqwest 0.13 client.
openidconnect = { version = "4", default-features = false }
# `rustls-no-provider`: TLS through rustls with the aws-lc-rs provider that
# `main` installs as the process default. Roots come from `webpki-root-certs`
# (see `http_tls`) — the `FROM scratch` image has no system certificate store
# for reqwest's platform verifier to read.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "gzip", "stream"] }
webpki-root-certs = "1"

# --- S3 / Garage storage ---
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls"] }

# --- Image decoding / EXIF-strip via re-encode ---
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# --- HTML scraping (MFC parser; the live fetcher is gated behind Cloudflare) ---
scraper = { version = "0.29", default-features = false }

# --- Justificatif (invoice) parsing — Palier 1: pure-Rust, in-binary, offline ---
# pdf-extract pulls the PDF text layer (built on lopdf): no native deps, links
# into the FROM-scratch static binary, memory-safe (no libpoppler CVE surface).
# regex drives the label-anchored heuristic field extraction. Both pure Rust,
# zero OpenSSL. NB: image/scanned receipts have no text layer → manual entry
# (OCR is a deferred, opt-in palier). Pinned ≥0.12 to pull a lopdf ≥0.42 that
# fixes RUSTSEC-2026-0187 (deeply-nested-object recursion → process abort on a
# crafted invoice PDF, uncatchable). pdf-extract parses UNTRUSTED user uploads.
pdf-extract = "0.12"
regex = "1"

# --- Insurance dossier: merge each item's invoices into ONE PDF ---
# `lopdf` merges the existing invoice PDFs and decrypts empty-password store
# invoices (pure-Rust RustCrypto — no OpenSSL); `printpdf` builds the per-figure
# separator pages and wraps image receipts (jpg/png/webp) as PDF pages.
# The DIRECT lopdf parses user-uploaded PDFs, so it tracks the latest release
# (≥0.42 for RUSTSEC-2026-0187; 0.47 adds bounded decompression, used by the
# dossier's page-size probe). printpdf 0.12 carries its own lopdf ^0.44, which
# only builds OUR separator pages — it never parses untrusted input.
# Everything is in-memory (no temp files → fine under the read-only container).
lopdf = "0.47"
# text_layout pulls azul-layout → ParsedFont (TTF embedding) so the separator
# pages can render real UTF-8 (accents é · …) and we can measure glyph widths to
# wrap long titles. Bundled font lives in assets/fonts/ (Go fonts, BSD-3).
printpdf = { version = "0.12", default-features = false, features = ["jpeg", "png", "webp", "text_layout"] }

# --- TLS provider (installed as rustls default at startup) ---
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12"] }

# --- Notifications: SMTP outbound. Strictly rustls (no OpenSSL). ---
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs",
    "rustls-native-certs", "builder", "hostname",
] }

# --- Notifications: VAPID key generation (admin tooling).
#     Pure-rust ECDSA P-256 from RustCrypto — no OpenSSL pulled in. The
#     admin endpoint POST /admin/notification-channels/browser_push/generate-vapid
#     uses this to mint a fresh keypair without external tools. ---
p256 = { version = "0.14", default-features = false, features = [
    "std", "pem", "ecdsa", "pkcs8",
] }
base64 = "0.23"

# --- MCP server (routes::mcp) ---
# Official Rust SDK. `transport-streamable-http-server` pulls only http /
# http-body / bytes / sse-stream / tower — no HTTP *client*, so no second
# reqwest major and nothing that could drag in OpenSSL (verified with
# `cargo tree -i openssl-sys`). The `auth` feature is deliberately NOT enabled:
# we authenticate with per-user API keys, not OAuth, so its oauth2 + reqwest
# dependency would be dead weight in a `FROM scratch` image.
rmcp = { version = "3.10", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
# Schema derives for the MCP tool input/output types. `uuid1` so an id
# argument can be a real `Uuid` in the schema instead of a bare string the
# tool would have to parse and re-validate.
schemars = { version = "1", features = ["uuid1"] }

# --- API-key hashing (domain::api_key) ---
# SHA-256 over a 256-bit CSPRNG secret, not a password KDF: there is no
# low-entropy guess to slow down, and an unsalted digest is what lets the key
# lookup stay a single indexed query. Already in the tree transitively via
# `web-push-native`; pure Rust, no OpenSSL.
sha2 = { version = "0.11", default-features = false }

# --- Notifications: Web Push.
#
# Pure-Rust stack — no OpenSSL anywhere in the tree (verified with
# `cargo tree -i openssl-sys`). `web-push-native` brings:
#   - jwt-simple (pure-rust feature → superboring backend) for the
#     VAPID ES256 JWT signing.
#   - p256 + aes-gcm + hkdf + sha2 (RustCrypto) for the RFC 8291
#     aes128gcm payload encryption + ECDH key agreement with the
#     subscriber's keys.
# The crate produces an `http::Request<Vec<u8>>` we hand off to our
# existing reqwest client (rustls + aws-lc-rs).
web-push-native = "0.5"
http = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
