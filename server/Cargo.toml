[package]
name = "figurecollector-server"
version = "0.46.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "FigureCollector backend — hardened Rust/Axum API for self-hosted figurine collection management"
repository = "https://github.com/Dim145/FigureCollector"
publish = false

[[bin]]
name = "figurecollector-server"
path = "src/main.rs"

[dependencies]
# --- Web stack ---
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit", "request-id"] }
tower_governor = "0.8"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Serialization & errors ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

# --- CLI ---
clap = { version = "4", features = ["derive", "env"] }

# --- Misc utilities ---
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
time = { version = "0.3", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
bytes = "1"
futures = "0.3"
# Cron-expression parser for the admin-scheduled price-refresh job
# (services::price_cron). Pure Rust, chrono-native — no OpenSSL. An empty
# schedule disables the feature.
croner = "3"

# --- In-process cache (moka, pure-Rust, no OpenSSL) ---
# Backs the `cache` module's default in-memory backend (per-entry TTL via moka's
# Expiry trait). Pluggable: a Redis/memcached backend is just another CacheStore
# impl behind the same trait, selected by CACHE_BACKEND.
moka = { version = "0.12", features = ["future"] }

# --- Database (sqlx with rustls / aws-lc-rs — NO OpenSSL) ---
sqlx = { version = "0.8", default-features = false, features = [
    "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs",
    "chrono", "uuid", "json", "macros", "migrate", "rust_decimal",
] }

# --- pgvector — vector(384) embeddings for the visual (photo) search ---
# Already pinned to 0.4.2 in Cargo.lock (pulled transitively by sea-orm). Its
# only extra dep is serde + the sqlx Encode/Decode glue — no OpenSSL, so it
# respects the zero-OpenSSL hard rule.
pgvector = { version = "0.4", default-features = false, features = ["sqlx"] }

# --- Sessions (Postgres-backed) ---
# Pinned to 0.14 because `tower-sessions-sqlx-store` 0.15 (the latest released
# at this writing) was published against tower-sessions 0.14 — there is no
# sqlx-store release that satisfies SessionStore for tower-sessions 0.15 yet.
# Revisit when tower-sessions-sqlx-store ships a matching bump.
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["postgres"] }

# --- Sea-ORM migrations + entities ---
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "1.1", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }

# --- Password hashing (local auth) ---
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["alloc", "std", "rand_core"] }
rand = "0.10"

# --- OIDC ---
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# Pinned to 0.12 because `openidconnect` 4 transitively depends on
# reqwest ^0.12 (its `AsyncHttpClient` impl). Bumping to 0.13 here would
# create two reqwest majors in the graph and break OIDC discovery/token
# exchange. Revisit when openidconnect releases against reqwest 0.13.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "json", "gzip", "stream"] }

# --- S3 / Garage storage ---
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }

# --- Image decoding / EXIF-strip via re-encode ---
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# --- HTML scraping (MFC parser; the live fetcher is gated behind Cloudflare) ---
scraper = { version = "0.27", default-features = false }

# --- Justificatif (invoice) parsing — Palier 1: pure-Rust, in-binary, offline ---
# pdf-extract pulls the PDF text layer (built on lopdf): no native deps, links
# into the FROM-scratch static binary, memory-safe (no libpoppler CVE surface).
# regex drives the label-anchored heuristic field extraction. Both pure Rust,
# zero OpenSSL. NB: image/scanned receipts have no text layer → manual entry
# (OCR is a deferred, opt-in palier). Pinned ≥0.12 to pull a lopdf ≥0.42 that
# fixes RUSTSEC-2026-0187 (deeply-nested-object recursion → process abort on a
# crafted invoice PDF, uncatchable). pdf-extract parses UNTRUSTED user uploads.
pdf-extract = "0.12"
regex = "1"

# --- Insurance dossier: merge each item's invoices into ONE PDF ---
# `lopdf` merges the existing invoice PDFs and decrypts empty-password store
# invoices (pure-Rust RustCrypto — no OpenSSL); `printpdf` builds the per-figure
# separator pages and wraps image receipts (jpg/png/webp) as PDF pages. printpdf
# We bump the DIRECT lopdf (used by the dossier merge, which loads user-uploaded
# PDFs) to 0.42 for RUSTSEC-2026-0187 (nested-object recursion → uncatchable
# process abort). printpdf 0.9 keeps its own lopdf ^0.39 internally, but that
# path only builds OUR separator pages — it never parses untrusted input.
# Everything is in-memory (no temp files → fine under the read-only container).
lopdf = "0.42"
# text_layout pulls azul-layout → ParsedFont (TTF embedding) so the separator
# pages can render real UTF-8 (accents é · …) and we can measure glyph widths to
# wrap long titles. Bundled font lives in assets/fonts/ (Go fonts, BSD-3).
printpdf = { version = "0.9", default-features = false, features = ["jpeg", "png", "webp", "text_layout"] }

# --- TLS provider (installed as rustls default at startup) ---
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12"] }

# --- Notifications: SMTP outbound. Strictly rustls (no OpenSSL). ---
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs",
    "rustls-native-certs", "builder", "hostname",
] }

# --- Notifications: VAPID key generation (admin tooling).
#     Pure-rust ECDSA P-256 from RustCrypto — no OpenSSL pulled in. The
#     admin endpoint POST /admin/notification-channels/browser_push/generate-vapid
#     uses this to mint a fresh keypair without external tools. ---
p256 = { version = "0.13", default-features = false, features = [
    "std", "pem", "ecdsa", "pkcs8",
] }
base64 = "0.22"

# --- Notifications: Web Push.
#
# Pure-Rust stack — no OpenSSL anywhere in the tree (verified with
# `cargo tree -i openssl-sys`). `web-push-native` brings:
#   - jwt-simple (pure-rust feature → superboring backend) for the
#     VAPID ES256 JWT signing.
#   - p256 + aes-gcm + hkdf + sha2 (RustCrypto) for the RFC 8291
#     aes128gcm payload encryption + ECDH key agreement with the
#     subscriber's keys.
# The crate produces an `http::Request<Vec<u8>>` we hand off to our
# existing reqwest client (rustls + aws-lc-rs).
web-push-native = "0.4"
http = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
